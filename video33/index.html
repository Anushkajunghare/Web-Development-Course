<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Color Nav Bar</title>
    <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:ital@1&display=swap');
        </style>

    <style>

         /* :root{ 
            --primary-color: #1f5f72;
            --text-clolor: white;
            --secondary-color: #a1d2df;  */

            :root{
            --primary-color: #860e44;
            --text-clolor: white;
            --secondary-color: #c9699c;
        }

        body{
            background-color: var(--secondary-color);
        }

        *{
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
        }
        
        nav{
            background-color: var(--primary-color);
            padding: 12px 0;
        }
       ul li{
        list-style: none;
        display: inline;
        padding : 60px;
        font-weight: 400;
        color: var(--text-clolor);
        
       }
       </style>


      
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a>Home</a></li>
                <li><a>About</a></li>
                <li><a>Services</a></li>
                <li><a>Contact Us</a></li>
            </ul>
        </nav>
</body>
</html>
